[tox]
envlist = pep8,eslint,karma-local,docs-local,releasenotes
minversion = 3.18.0
skipsdist = True

[testenv]
usedevelop = True
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
commands =
  python manage.py test {posargs} --settings=magnum_ui.test.settings --exclude-tag integration

# For installation of horizon on local
# NOTICE: this tox.ini requires horizon repository cloned in sibling directory.
[testenv:hz-local]
commands =
  pip install -e ../horizon

[testenv:venv]
commands = {posargs}

[testenv:pep8]
commands = flake8 {posargs}

[flake8]
# F405 TEMPLATES may be undefined, or defined from star imports
# (because it is not easy to avoid this in openstack_dashboard.test.settings)
ignore = F405,W504
exclude = .git,.tox,dist,*lib/python*,*egg,build,panel_template,dash_template,local_settings.py,*/local/*,*/test/test_plugins/*,.ropeproject,node_modules
max-complexity = 20

[testenv:cover]
commands =
  coverage erase
  coverage run {toxinidir}/manage.py test magnum_ui --settings=magnum_ui.test.settings {posargs} --exclude-tag integration
  coverage xml --omit '.tox/cover/*' -o 'cover/coverage.xml'
  coverage html --omit '.tox/cover/*' -d 'cover/htmlcov'

[testenv:eslint]
allowlist_externals =
  npm
commands =
  npm install
  npm run lint

# NOTE(shu-mutow): The "postinstall" script on package.json will install horizon
# from master branch into karma environment with python3.x for testing javascripts.
# Horizon from master is needed to be cloned into ../horizon on both local and CI.
[testenv:karma]
allowlist_externals =
  {[testenv:eslint]allowlist_externals}
commands =
  npm install
  npm run test

[testenv:karma-local]
allowlist_externals =
  {[testenv:eslint]allowlist_externals}
commands =
  {[testenv:karma]commands}

[testenv:docs]
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
  # magnum-ui doc generated the module reference,
  # so requirements.txt should be here to apply upper-constraints.
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/doc/requirements.txt
commands=
  sphinx-build -W -b html doc/source doc/build/html

[testenv:pdf-docs]
deps = {[testenv:docs]deps}
allowlist_externals =
  make
  rm
commands =
  rm -rf doc/build/pdf
  sphinx-build -W -b latex doc/source doc/build/pdf
  make -C doc/build/pdf

[testenv:docs-local]
deps =
  {[testenv:docs]deps}
commands=
  {[testenv:hz-local]commands}
  {[testenv:docs]commands}

[testenv:releasenotes]
deps =
  {[testenv:docs]deps}
commands =
  sphinx-build -a -E -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[testenv:integration{,-playwright}]
# Run integration tests using Playwright against a running dashboard
# Set PLAYWRIGHT_BROWSER to choose browser: chromium, firefox, or webkit (default)
# Set PLAYWRIGHT_VIDEO / PLAYWRIGHT_TRACE to: off (default), on, retain-on-failure
# Browser binaries are installed by playbooks/playwright/pre.yaml in CI.
# For local runs: python -m playwright install webkit
passenv =
  DISPLAY
  XAUTHORITY
  OS_*
  MAGNUM_DASHBOARD_URL
  MAGNUM_IMAGE
  MAGNUM_EXTERNAL_NETWORK
  MAGNUM_FLAVOR
  PLAYWRIGHT_BROWSER
  PLAYWRIGHT_HEADLESS
  PLAYWRIGHT_TIMEOUT
  PLAYWRIGHT_SCREENSHOTS
  PLAYWRIGHT_VIDEO
  PLAYWRIGHT_TRACE
  PLAYWRIGHT_IGNORE_HTTPS_ERRORS
setenv =
  PLAYWRIGHT_BROWSER = {env:PLAYWRIGHT_BROWSER:webkit}
  PLAYWRIGHT_HEADLESS = {env:PLAYWRIGHT_HEADLESS:True}
  PLAYWRIGHT_TIMEOUT = {env:PLAYWRIGHT_TIMEOUT:30000}
  PLAYWRIGHT_SCREENSHOTS = {env:PLAYWRIGHT_SCREENSHOTS:True}
  PLAYWRIGHT_VIDEO = {env:PLAYWRIGHT_VIDEO:off}
  PLAYWRIGHT_TRACE = {env:PLAYWRIGHT_TRACE:off}
  PLAYWRIGHT_IGNORE_HTTPS_ERRORS = {env:PLAYWRIGHT_IGNORE_HTTPS_ERRORS:False}
  PLAYWRIGHT_OUTPUT_DIR = {toxinidir}/playwright
  PLAYWRIGHT_BROWSERS_PATH = {toxinidir}/.playwright
  MAGNUM_DASHBOARD_URL = {env:MAGNUM_DASHBOARD_URL:http://localhost/dashboard}
  # Image registered with os_distro by the magnum devstack plugin
  MAGNUM_IMAGE = {env:MAGNUM_IMAGE:noble-server-cloudimg-amd64}
  MAGNUM_EXTERNAL_NETWORK = {env:MAGNUM_EXTERNAL_NETWORK:public}
  MAGNUM_FLAVOR = {env:MAGNUM_FLAVOR:m1.small}
  OS_USERNAME = {env:OS_USERNAME:admin}
  OS_PASSWORD = {env:OS_PASSWORD:secretadmin}
  OS_AUTH_URL = {env:OS_AUTH_URL:http://localhost/identity}
  OS_PROJECT_NAME = {env:OS_PROJECT_NAME:admin}
  OS_USER_DOMAIN_NAME = {env:OS_USER_DOMAIN_NAME:Default}
  OS_PROJECT_DOMAIN_NAME = {env:OS_PROJECT_DOMAIN_NAME:Default}
  OS_INSECURE = {env:OS_INSECURE:True}
  OS_DEMO_USERNAME = {env:OS_DEMO_USERNAME:demo}
  OS_DEMO_PASSWORD = {env:OS_DEMO_PASSWORD:secretadmin}
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/playwright
  stestr run --concurrency 1 {posargs}
